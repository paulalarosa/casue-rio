name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [conteudo]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estudio/package-lock.json
      - working-directory: estudio
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}
        run: |
          npm ci
          npm run typecheck

  decidir:
    runs-on: ubuntu-latest
    outputs:
      precisa: ${{ steps.conferir.outputs.precisa }}
    steps:
      - uses: actions/checkout@v7
      - id: conferir
        env:
          PROJETO: ${{ vars.SANITY_PROJECT_ID }}
          CONJUNTO: ${{ vars.SANITY_DATASET }}
          SITE: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Evento ${{ github.event_name }}: publica sem conferir."
            echo "precisa=true" >> "$GITHUB_OUTPUT"
          else
            bash .github/scripts/venceu.sh
          fi

  publicar:
    needs: decidir
    if: needs.decidir.outputs.precisa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar
        working-directory: web
        run: npm ci

      - name: Conferir o repositório
        run: node scripts/sem-comentarios.mjs --exigir

      - name: Conferir
        working-directory: web
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test

      - name: Construir
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_TURNSTILE_KEY: ${{ vars.TURNSTILE_KEY }}
          NEXT_PUBLIC_CF_ANALYTICS: ${{ vars.CF_ANALYTICS }}
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: cards-instagram
          path: web/cards/
          retention-days: 90
          if-no-files-found: ignore

      - name: Publicar no Cloudflare Pages
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.136.3 pages deploy out --project-name=casuerio --branch=main --commit-hash="$GITHUB_SHA"

      - if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - if: vars.AWS_ROLE_ARN != ''
        name: Subir os arquivos com nome versionado
        working-directory: web
        run: |
          aws s3 sync out/ s3://casuerio-site-prod/ \
            --delete \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public, max-age=31536000, immutable"

      - if: vars.AWS_ROLE_ARN != ''
        name: Subir o resto
        working-directory: web
        run: |
          aws s3 sync out/ s3://casuerio-site-prod/ \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - if: vars.AWS_ROLE_ARN != ''
        name: Limpar o cache da borda
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_ID }} \
            --paths "/*"
