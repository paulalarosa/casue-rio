# Publica o site na AWS: S3 por trás do CloudFront.
#
# 🔴 Este fluxo NÃO FAZ NADA enquanto `vars.AWS_ROLE_ARN` estiver vazia. É o
# que permite ele existir no repositório antes de a infraestrutura existir,
# sem pintar de vermelho toda publicação.
name: Publicar na AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Publicar no painel republica o site.
  repository_dispatch:
    types: [conteudo]
  # 🔴 A remontagem diária É O AGENDAMENTO DA REVISTA.
  #
  # O site filtra os artigos por `data <= hoje`. Um texto publicado no painel
  # com data à frente fica pronto e fora do ar; quando esta tarefa roda no dia
  # marcado, a condição passa a valer e ele entra sozinho. A Sanity vende isso
  # pronto no plano Growth, a 15 dólares por pessoa por mês. Aqui sai de graça,
  # com o que já existe.
  #
  # 12:00 UTC é 9h no Rio, que não tem horário de verão desde 2019. O GitHub
  # pode atrasar uma tarefa agendada em bons minutos quando está cheio, e para
  # um texto que entra "de manhã" isso é irrelevante.
  #
  # 🔴 A armadilha é outra: o GitHub DESLIGA tarefas agendadas depois de 60
  # dias sem atividade no repositório, sem avisar. A rede de proteção é que
  # qualquer publicação no painel remonta o site na hora, e a remontagem
  # carrega junto todo artigo cuja data já chegou. O pior caso não é o texto
  # não sair: é sair no dia em que qualquer outra coisa for publicada.
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read
  # Exigido pelo OIDC: é o que deixa o fluxo pedir um token de identidade à
  # AWS em vez de guardar chave de acesso aqui dentro. Chave de acesso em
  # segredo do repositório é chave que ninguém lembra de girar.
  id-token: write

concurrency:
  group: aws
  cancel-in-progress: true

jobs:
  publicar:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar
        working-directory: web
        run: npm ci

      - name: Construir
        working-directory: web
        env:
          # 🔴 VAZIO, e isto é a diferença mais importante entre esta
          # publicação e a do Pages. Lá o site mora em `usuario.github.io/REPO`
          # e todo caminho absoluto precisa do prefixo; aqui ele mora na raiz
          # de um domínio próprio. Deixar o prefixo aqui faria cada folha de
          # estilo, cada vídeo e cada imagem procurar `/casue-rio/...` num
          # servidor onde essa pasta não existe.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Duas passadas de sincronia, e a ordem importa.
      #
      # 🔴 Primeiro o que tem nome versionado (`/_next/`), com cache longo:
      # esses arquivos têm o resumo do conteúdo no nome, então nunca mudam de
      # conteúdo sem mudar de nome, e podem ficar um ano no navegador.
      #
      # 🔴 Depois o HTML, com `no-cache`. Se o HTML fosse junto no cache
      # longo, a pessoa que visitou o site ontem continuaria vendo a página
      # velha por um ano, apontando para pacotes que já não existem.
      - name: Subir os arquivos com nome versionado
        working-directory: web
        run: |
          aws s3 sync out/ s3://casuerio-site-prod/ \
            --delete \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Subir o resto
        working-directory: web
        run: |
          aws s3 sync out/ s3://casuerio-site-prod/ \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      # A invalidação é o que faz a página nova aparecer agora, e não quando
      # o cache da borda expirar sozinho.
      - name: Limpar o cache da borda
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_ID }} \
            --paths "/*"
