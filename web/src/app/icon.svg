<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon: a placa esmaltada da marca, montagem 12 (reduzida).

       A folha de marca decide isto por mim, em dois lugares:
       · "12 · símbolo, reduzido ... abaixo de 30 px / favicon";
       · "só símbolo: 16 px", que é o mínimo absoluto da marca.

       A montagem 12 é a placa SEM o filete. Não é simplificação minha: numa
       aba de navegador a placa tem 16 px de lado, e o filete, que mede 2% do
       lado, viraria meio pixel. Meio pixel não desaparece, ele suja a borda,
       e o resultado é uma placa com contorno tremido em vez de uma placa.

       O ê é CURVA, e tem de ser: favicon não carrega fonte da web, então um
       <text> aqui cairia para a fonte do sistema e o símbolo da marca viraria
       um e-circunflexo qualquer. A curva saiu da Unbounded 700 com o
       fontTools, no mesmo lugar em que o SVG do pacote a desenha, e é a mesma
       que o componente `placa.tsx` usa. -->
  <rect x="0" y="0" width="100" height="100" rx="17.3" fill="#a8482a"/>
